name: Dependabot Change Note

on:
  workflow_call:
    inputs:
      changenote-format:
        description: "Markup format for the changenote."
        default: "rst"
        type: string
    secrets:
      BRUTUS_PAT_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changenote:
    name: Dependabot Change Note
    if: github.event.pusher.name == 'dependabot[bot]' && github.repository != 'beeware/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          # Don't persist the token in .git/config (avoids the artipacked
          # credential-leak vector); the push is authenticated explicitly below.
          persist-credentials: false

      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.BRUTUS_PAT_TOKEN }}
        run: |
          git config --local user.email "$(git log --pretty='%ae' -1)"
          git config --local user.name "dependabot[bot]"
          # Configure git to authenticate via the gh credential helper using
          # BRUTUS_PAT_TOKEN, rather than a token persisted by actions/checkout.
          gh auth setup-git

      - name: Commit Change Note
        env:
          GITHUB_HEAD_COMMIT_ID: ${{ github.event.head_commit.id }}
          GITHUB_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_CHANGENOTE_FORMAT: ${{ inputs.changenote-format }}
        run: |
          # Retrieve PR number from GitHub API
          PR_NUM=$(gh api "repos/{owner}/{repo}/commits/${GITHUB_HEAD_COMMIT_ID}/pulls" --jq '.[].number')
          CHANGENOTE_FILEPATH="./changes/${PR_NUM}.misc.${INPUT_CHANGENOTE_FORMAT}"

          # Create change note from first line of dependabot commit
          # Replace "Bump" with "Updated", and add markup to URLs.
          NEWS=$(printf "%s" "${GITHUB_HEAD_COMMIT_MESSAGE}" | head -n1 | sed -e 's|Bump|Updated|' | sed -e 's|\(https://[^/]*/[^ .]*\)|<\1>|')
          printf "%s.\n" "${NEWS}" > "${CHANGENOTE_FILEPATH}"

          # Commit the change note
          git add "${CHANGENOTE_FILEPATH}"
          # "dependabot skip" tells Dependabot to continue rebasing this branch despite foreign commits
          git commit -m "Add changenote. [dependabot skip]"

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.BRUTUS_PAT_TOKEN }}
        run: git push origin
